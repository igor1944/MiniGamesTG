# ============================================================
#  MiniGamesTG — конфигурация плагина
#  Мини-игры + Telegram-бот: результаты, статистика, топ.
# ============================================================

telegram:
  # Включить Telegram-бота. Если false (или пустой токен) — плагин
  # работает без Telegram, мини-игры и статистика доступны в игре.
  enabled: false

  # Токен бота — получить у @BotFather в Telegram (/newbot)
  bot-token: ""

  # ID чата/группы, куда бот будет раз в stats-interval-minutes
  # отправлять общую статистику и топ игроков.
  # Как узнать: добавьте бота в группу и напишите ему /chatid
  # (для групп ID отрицательный, например -1001234567890).
  report-chat-id: ""

  # Как часто (в минутах) отправлять общую статистику и топ в report-chat-id.
  stats-interval-minutes: 60

  # Отправлять игрокам с привязанным Telegram личные уведомления
  # о результатах их игр (победа/поражение/место).
  notify-players: true

  # Дополнительно публиковать результат КАЖДОЙ игры в report-chat-id.
  post-results-to-report-chat: false

game:
  # Публиковать краткий анонс результата игры в общий чат сервера.
  announce-results: true

  duel:
    # Отсчёт (секунды) перед началом дуэли.
    countdown-seconds: 3
    # Если создана хотя бы одна арена (/mg arena ...), дуэлянты всегда
    # телепортируются на случайную арену. Если арен нет, а эта опция true —
    # второй игрок телепортируется на точку напротив первого.
    # false без арен = бой начинается прямо там, где игроки стоят.
    teleport-players-together: true
    # Возвращать дуэлянтов на исходные позиции после боя
    # (проигравший возрождается там, где был до дуэли).
    teleport-back-after: true

  # Через сколько минут бездействия закрывать неактивное лобби.
  lobby-expire-minutes: 10

  reaction:
    # Случайная задержка перед показом слова (в тиках, 20 тиков = 1 сек).
    min-word-delay-ticks: 40
    max-word-delay-ticks: 160
    # Сколько секунд игрокам даётся на ввод слова.
    answer-timeout-seconds: 30
    # Слова для игры «Реакция» (можно дополнять).
    words:
      - арбуз
      - дракон
      - изумруд
      - кирка
      - крафт
      - алмаз
      - портал
      - эндермен
      - голем
      - динамит
      - шахта
      - стрела
      - зелье
      - кузница
      - факел

messages:
  # Префикс всех сообщений плагина в чате.
  prefix: "&8[&bMiniGamesTG&8] "
