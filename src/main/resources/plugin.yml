name: MiniGamesTG
version: 1.0.0
main: me.igor1944.minigamestg.MiniGamesTGPlugin
api-version: '1.18'
author: igor1944
description: "Мини-игры с Telegram-ботом: результаты игр, личная статистика игроков и периодический топ."
website: https://github.com/igor1944/MiniGamesTG

commands:
  mg:
    description: Управление мини-играми MiniGamesTG
    aliases: [minigame, minigames]
    usage: /mg help

permissions:
  minigamestg.create:
    description: Позволяет создавать мини-игры
    default: true
  minigamestg.admin:
    description: Администрирование MiniGamesTG (reload, отмена чужих игр и т.д.)
    default: op
