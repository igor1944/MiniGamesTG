name: Build & Smoke Test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: |
          mkdir -p /tmp/build-logs
          set -o pipefail
          mvn -B -DskipTests package 2>&1 | tee /tmp/build-logs/mvn.log

      - name: Smoke test on real Paper 1.18.2
        run: |
          mkdir -p /tmp/build-logs
          set -o pipefail
          {
          set -e
          set -x
          mkdir -p /tmp/server/plugins
          cp target/MiniGamesTG-*.jar /tmp/server/plugins/
          cd /tmp/server
          echo "eula=true" > eula.txt
          BUILD=$(curl -fsSL "https://fill.papermc.io/v3/projects/paper/versions/1.18.2" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['builds'][0])")
          echo "Latest Paper 1.18.2 build: $BUILD"
          URL=$(curl -fsSL "https://fill.papermc.io/v3/projects/paper/versions/1.18.2/builds/${BUILD}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          echo "Downloading: $URL"
          curl -fsSL -o paper.jar "$URL"
          (sleep 75; printf 'stop\n') | timeout 300 java -Xmx1G -jar paper.jar nogui > server.log 2>&1 || true
          cp server.log /tmp/build-logs/server.log
          set +x
          echo "===== server.log (tail) ====="
          tail -n 40 server.log
          grep -q "Done" server.log || { echo "FAIL: сервер не запустился"; exit 1; }
          grep -q "Enabling MiniGamesTG" server.log || { echo "FAIL: плагин не включился"; exit 1; }
          if grep -E "Error occurred while enabling MiniGamesTG|Error occurred while disabling MiniGamesTG|NoClassDefFoundError|NoSuchMethodError|ClassNotFoundException" server.log; then
            echo "FAIL: ошибки загрузки плагина"
            exit 1
          fi
          if grep -iE "exception.*minigamestg" server.log; then
            echo "FAIL: исключения, связанные с плагином"
            exit 1
          fi
          echo "SMOKE TEST OK: плагин загрузился на Paper 1.18.2 без ошибок"
          } 2>&1 | tee /tmp/build-logs/smoke.log

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniGamesTG
          path: target/MiniGamesTG-*.jar
          if-no-files-found: error

      - name: Publish jar to builds branch
        run: |
          set -e
          rm -rf /tmp/artifacts && mkdir -p /tmp/artifacts
          cp target/MiniGamesTG-*.jar /tmp/artifacts/MiniGamesTG-latest.jar
          cp target/MiniGamesTG-*.jar "/tmp/artifacts/MiniGamesTG-${GITHUB_SHA::7}.jar"
          cd /tmp/artifacts
          git init -q -b builds .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build from commit ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin builds
          echo "Builds branch updated"

      - name: Publish logs to ci-logs branch on failure
        if: failure()
        run: |
          set -e
          rm -rf /tmp/ci-logs-out && mkdir -p /tmp/ci-logs-out
          cp /tmp/build-logs/*.log /tmp/ci-logs-out/ 2>/dev/null || echo "no logs captured" > /tmp/ci-logs-out/empty.txt
          tail -n 300 /tmp/build-logs/mvn.log > /tmp/ci-logs-out/mvn-tail.txt 2>/dev/null || true
          cd /tmp/ci-logs-out
          git init -q -b ci-logs .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "CI logs for run ${{ github.run_id }} (commit ${{ github.sha }})"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-logs
          echo "Logs published to ci-logs branch"
